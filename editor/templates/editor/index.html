<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Képszerkesztő Stúdió</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link rel="stylesheet" href="/static/editor/css/style.css?v=4">
</head>
<body>
    <div class="workspace-layout">
        
<!-- BAL OSZLOP -->
        <aside class="sidebar left-sidebar">
            <div class="panel-header"><h2>🛠️ Tools</h2></div>
            
            <div class="tool-section">
                <label class="btn btn-primary btn-block">
                    📁 Upload image
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                </label>
            </div>

            <div class="tool-section" id="toolsSection" style="display: none;">
                <label class="section-title">Selection Tools</label>
                <button class="btn btn-action btn-block" id="btnDrawLasso" title="Select new object">✏️</button>
                <button class="btn btn-outline btn-block" id="btnRefineMask" title="Refine mask edges" style="margin-top:5px;">✨</button>
                
                <label class="section-title" style="margin-top: 12px;">Manual Mask Brush</label>
                <div class="button-row">
                    <button class="btn btn-mode" id="btnBrushAdd" title="Add to mask">➕</button>
                    <button class="btn btn-mode" id="btnBrushSub" title="Erase from mask">➖</button>
                </div>
                <div class="brush-slider-box">
                    <label>Brush Size: <span id="brushSizeVal">20</span>px</label>
                    <input type="range" id="brushSize" min="5" max="150" value="20">
                </div>
                <button class="btn btn-secondary btn-block" id="btnApplyBrush" title="Save manual changes">💾</button>
            </div>

            <div class="tool-section" id="actionSection" style="display: none;">
                <label class="section-title">Inpainting Settings</label>

                <div class="brush-slider-box" style="margin-bottom: 8px;">
                    <label>Mask Expansion: <span id="dilationSizeVal">5</span>px</label>
                    <input type="range" id="dilationSize" min="0" max="25" value="5">
                </div>

                <div class="brush-slider-box" style="margin-bottom: 8px;">
                    <label>Generation Prompt</label>
                    <input type="text" id="sdPrompt" value="background, seamless, high quality, realistic" style="width: 100%; padding: 4px; border-radius: 4px; border: 1px solid var(--panel-border); background: var(--bg-main); color: white;">
                </div>

                <div class="brush-slider-box" style="margin-bottom: 8px;">
                    <label>Negative Prompt</label>
                    <input type="text" id="sdNegativePrompt" value="artifact, messy, ugly, object, person" style="width: 100%; padding: 4px; border-radius: 4px; border: 1px solid var(--panel-border); background: var(--bg-main); color: white;">
                </div>

                <div class="brush-slider-box" style="margin-bottom: 8px;">
                    <label>Quality (Steps): <span id="sdStepsVal">25</span></label>
                    <input type="range" id="sdSteps" min="10" max="50" value="25">
                </div>

                <div class="brush-slider-box" style="margin-bottom: 12px;">
                    <label>Prompt Guidance: <span id="sdGuidanceVal">7.5</span></label>
                    <input type="range" id="sdGuidance" min="1.0" max="15.0" step="0.5" value="7.5">
                </div>
            </div>

            <label class="section-title">Actions</label>
            <button class="btn btn-primary btn-block" id="btnInpaintBackground" title="Fill background">🎨 Fill Background</button>
            
            
            <div class="status-box" id="statusMessage">Upload an image to begin.</div>
        </aside>

        <!-- KÖZÉPSŐ MUNKATERÜLET -->
        <main class="canvas-area" id="canvasArea">
            <div class="canvas-toolbar">
                <button class="btn btn-outline" id="btnToolHome" title="Fit image to screen">🏠</button>
                <button class="btn btn-outline" id="btnToolPan" title="Pan canvas">✋</button>
                <button class="btn btn-outline" id="btnToolZoomIn" title="Zoom in">🔍+</button>
                <button class="btn btn-outline" id="btnToolZoomOut" title="Zoom out">🔍-</button>
            </div>
            <div class="canvas-viewport" id="canvasContainer">
                <canvas id="mainCanvas"></canvas>
            </div>
        </main>

        <!-- JOBB OSZLOP -->
        <aside class="sidebar right-sidebar">
            <div class="panel-header"><h2>📑 Layers</h2></div>
            <div class="layer-list" id="layerList">
                
                <div class="layer-item active" data-id="original" id="layerOriginal">
                    <div class="layer-preview-box">🖼️</div>
                    <div class="layer-info">
                        <span class="layer-title">Original Image</span>
                        <span class="layer-sub">Base layer</span>
                    </div>
                    <div class="layer-actions">
                        <button class="save-btn" title="Save layer">💾</button>
                    </div>
                </div>

                <div id="dynamicObjectLayers"></div>

                <div class="layer-item disabled" data-id="background" id="layerBackground">
                    <div class="layer-preview-box">🎨</div>
                    <div class="layer-info">
                        <span class="layer-title">Filled Background</span>
                        <span class="layer-sub">Stable Diffusion inpainting</span>
                    </div>
                    <div class="layer-actions">
                        <button class="save-btn" title="Save layer">💾</button>
                        <button class="delete-btn" id="btnDeleteBackground" style="display:none;" title="Delete fill">🗑️</button>
                    </div>
                </div>
            </div>
            <!-- Aktív réteg tulajdonságai (Alsó panel) -->
            <div class="layer-properties" id="layerProperties">
                <div class="prop-header">ℹ️ Active Layer Info</div>
                
                <div class="prop-row">
                    <span class="prop-label">Type:</span>
                    <span class="prop-value" id="propType">Original Image</span>
                </div>
                
                <div class="prop-row">
                    <span class="prop-label">Size:</span>
                    <span class="prop-value" id="propSize">- x - px</span>
                </div>
                
                <div class="prop-row">
                    <span class="prop-label">Coverage:</span>
                    <span class="prop-value" id="propCoverage">100%</span>
                </div>
                
                <div class="prop-row" id="propPromptRow" style="display: none; flex-direction: column; align-items: flex-start; gap: 4px; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <span class="prop-label">Prompt used:</span>
                    <span class="prop-value" id="propPrompt" style="font-style: italic; color: #a1a1aa; line-height: 1.3;">-</span>
                </div>
            </div>
        </aside>
    </div>
    <script src="/static/editor/js/app.js?v=4"></script>
</body>
</html>
