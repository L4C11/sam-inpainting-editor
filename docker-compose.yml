services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sam_inpainting_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./checkpoints:/app/checkpoints
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]